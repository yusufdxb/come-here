# Class demo configuration: "come here" -> DOA -> turn -> DOA-gated caller -> approach -> sit.
#
#   ros2 launch come_here_bringup professor_demo.launch.py              # dry run, no motion
#   ros2 launch come_here_bringup professor_demo.launch.py dry_run:=false
#
# Scenario: a caller several meters from a standing GO2 (mcf mode), other
# people possibly in view: the robot hears "come here", measures the voice
# direction (software DOA, calibrated by scripts/calibrate_doa.py), turns once
# (closed loop on odometry yaw), selects only a person inside the DOA gate,
# ALIGN/WALK, stops about 0.8 m away, StopMove, settles, sits, checks the face,
# speaks, and stays seated until estop_console "reset". No L1 / deadman input.
# Values marked "hw 2026-04-24" are the ones the last full hardware run used.
# Launch arguments: skip_turn_to_sound:=true restores the camera-only demo.

audio_node:
  ros__parameters:
    use_mock: false                  # launch argument use_mock overrides
    wake_detector: whisper
    enable_doa: false                # firmware DOAANGLE polling: register observed stuck
    doa_source: software             # SRP-PHAT on raw capsules, per wake utterance
    respeaker_frame_offset_deg: 0.0  # used only with doa_calibration_path:='' (launch doa_offset_deg)
    doa_mirror: false                # launch argument doa_mirror; true if left/right swap
    doa_grid_deg: 2.0
    doa_peak_full_scale: 0.25        # SRP peak counted as full confidence; see probe
    doa_firmware_advisory: false     # the register read blocks the executor (100 s USB timeout)
    doa_calibration_path: ~/come_here_trials/doa_calibration.json   # scripts/calibrate_doa.py
    require_doa_calibration: true    # no file -> no bearing published, loud ERROR, no turn
    publish_rate_hz: 10.0
    health_period_s: 5.0             # /come_here/audio_health and a log line
    whisper_model_size: base.en
    whisper_device: cpu
    whisper_compute_type: int8
    whisper_cpu_threads: 2           # uncapped CTranslate2 starved the camera on the Orin
    whisper_adapter_path: ""
    whisper_confidence_threshold: 0.3   # ODIN lab: far-field phrase heard at 0.28-0.45; 0.4 missed Apr 21
    whisper_no_speech_threshold: 0.75   # ODIN lab: no_speech_prob inflates with the robot powered
    whisper_vad_filter: true
    phrase_ratio_threshold: 0.80     # fuzzy "come here" match ("come hear" passes)
    wake_cooldown_s: 3.0             # one utterance cannot fire twice
    mic_device: ReSpeaker            # resolved by name; the 6-channel array is preferred
    mic_prefer_far_field: true
    mic_channels: 6                  # ch0 DSP beam for Whisper, ch1-4 raw capsules for DOA
    mic_beam_channel: 0              # DSP beamformed output
    mic_gain: 1.0
    respeaker_profile: far_field     # launch argument respeaker_profile overrides
    adaptive_gate: true              # launch argument adaptive_gate overrides
    gate_snr_margin: 2.0             # gate = max(gate_floor_rms, noise_floor * margin)
    gate_floor_rms: 0.003
    calibration_s: 1.0               # room measured before listening; keep quiet at startup
    preroll_sec: 0.25
    utterance_rms_threshold: 0.015   # fixed gate, used only with adaptive_gate:=false
    segment_peak_threshold: 0.02
    silence_to_end_sec: 0.70
    min_utterance_sec: 0.20
    max_utterance_sec: 4.50

perception_node:
  ros__parameters:
    use_mock: false                  # launch argument use_mock overrides
    publish_rate_hz: 10.0            # upper bound; YOLO runs once per new camera frame
    model_path: /home/unitree/come-here/models/yolo11n.pt
    confidence: 0.45                 # YOLO person confidence floor
    yolo_imgsz: 320
    max_frame_age_s: 0.5             # older camera frame -> not-detected; preflight needs >= 3 Hz
    bearing_ema_alpha: 1.0           # raw bearing; the single EMA is in behavior_node
    use_lidar_distance: true
    lidar_cloud_topic: /utlidar/cloud_base
    lidar_max_age_s: 2.0
    lidar_min_vertical_extent_m: 0.15
    lidar_min_points: 4
    lidar_z_min: 0.1
    lidar_cone_half_rad: 0.30
    gate_max_age_s: 0.5              # behavior_node republishes the target gate every tick

face_detector_node:
  ros__parameters:
    use_mock: false
    face_detector: mediapipe         # one inference, only after the robot sits
    min_confidence: 0.5

behavior_node:
  ros__parameters:
    tick_rate_hz: 10.0
    trial_log_enabled: true
    trial_log_dir: ~/come_here_trials   # launch argument trial_log_dir overrides
    # Demo scope
    skip_turn_to_sound: false        # launch argument; true = camera-only demo
    arrival_mode: sit_and_identify   # stop, settle, sit, face check, speak, stay seated
    arrival_hold_s: 2.0
    # Speech: Aria clips in come_here_audio/scripts, one chosen at random per '|'.
    wake_speak_text: ""
    direction_speak_text: "Got you. I'm on my way.|I hear you. Coming over.|Alright, I found your direction."
    acquired_speak_text: "There you are.|I see you.|Found you. Coming closer."
    speak_text: "Made it.|Here I am.|Found you."
    direction_confidence_threshold: 0.5   # launch argument; set from calibrate_doa.py confidences
    require_direction: true          # no confident DOA -> abort, never walk to a guessed person
    turn_result_timeout_s: 7.0       # bridge rotate_timeout_s 6.0 + 1
    turn_settle_s: 0.7               # frames from the end of the turn cannot select anyone
    acquire_gate_half_rad: 0.44      # +/- 25 deg around where the voice is after the turn
    track_gate_half_rad: 0.44        # +/- 25 deg around the tracked caller while moving
    direction_max_age_s: 3.0         # a bearing older than this belongs to another utterance
    turn_min_rad: 0.2                # caller within 11 deg of ahead: skip the turn
    listening_timeout_s: 1.5
    # Acquisition
    person_confidence_threshold: 0.5
    search_min_consecutive_detections: 2   # two fresh frames before any motion
    search_timeout_s: 10.0           # no caller acquired -> IDLE
    max_person_bearing_rad: 1.0      # larger bearings are corrupt, not people
    max_person_distance_m: 10.0
    # Lost person: stop, then ACQUIRE_PERSON needs 2 new frames to resume
    lost_debounce_s: 0.3             # the 3-tick debounce, hw 2026-04-24
    person_stale_timeout_s: 1.5      # no valid detection at all -> stop
    # Bearing and ALIGN/WALK (hw 2026-04-24)
    bearing_ema_alpha: 0.3
    approach_align_threshold_rad: 0.15    # ALIGN -> WALK inside this
    approach_realign_threshold_rad: 0.30  # WALK -> ALIGN only beyond this
    approach_min_align_s: 0.4
    approach_min_walk_s: 1.5
    approach_speed: 0.6              # mcf clean trot needs >= 0.5
    approach_ccw_yaw: 0.6
    approach_cw_yaw: 0.6
    # Stopping
    bbox_stop_fraction: 0.75         # close-range stop; stopped ~0.8 m, hw 2026-04-24
    approach_stop_distance_m: 0.8    # LiDAR/pinhole distance, read long while walking
    max_walk_distance_m: 2.0         # launch argument; = caller start distance - 0.5 m
    approach_timeout_s: 20.0
    # Arrival sequence (sit_and_identify)
    final_align_rad: 0.15            # arrive more than 9 deg off: yaw-only turn onto the caller first
    final_align_timeout_s: 2.0
    pre_sit_settle_s: 1.0            # zero velocity, then 1 s standing still, then Sit
    sit_settle_s: 3.0
    face_timeout_s: 1.5
    speak_hold_s: 5.0
    stand_settle_s: 0.5
    sit_hold_until_reset: true       # stay seated; estop_console "reset" stands up

go2_bridge_node:
  ros__parameters:
    dry_run: true                    # launch argument dry_run overrides
    require_motion_mode: mcf         # refuse all motion unless CheckMode reports mcf
    motion_mode_timeout_s: 5.0
    max_vx: 0.7                      # clamp; the demo commands 0.6
    max_yaw_rate: 1.0                # clamp; the demo commands 0.6
    reject_vx_above: 1.5             # beyond this a command is corrupt: stop
    reject_yaw_rate_above: 3.0
    allow_combined_motion: false     # mcf degrades on vx + yaw together
    cmd_velocity_timeout_s: 0.5      # watchdog
    republish_rate_hz: 20.0          # mcf gait latching, hw 2026-04-24
    enable_rotate_command: true      # TURN_TO_SOUND
    enable_posture_commands: true    # Sit 1009 after arrival, stand on operator reset
    manual_override_estop: true      # a remote stick beyond the threshold latches the e-stop
    manual_override_axis_threshold: 0.2
    cmd_z: 1.0                       # turn rate; mcf steps cleanly CCW at 1.0 (hw 2026-04-17)
    deg_per_sec: 57.0                # timed fallback only (1.0 rad/s nominal), unmeasured
    rotate_closed_loop: true         # turn until /utlidar/robot_odom yaw moved by the target
    odom_topic: /utlidar/robot_odom
    odom_max_age_s: 0.5
    rotate_deadband_rad: 0.12        # about 7 deg; the visual ALIGN finishes the job
    rotate_timeout_s: 6.0
    rotate_prefer_ccw_beyond_rad: 2.6   # beyond 150 deg turn left the long way
    sit_api_id: 1009
    stand_api_id: 1002
    move_api_id: 1008
    stop_move_api_id: 1003
    wav_chunk_size_bytes: 16384
    wav_chunk_delay_s: 0.15
